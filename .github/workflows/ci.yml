name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          experimental: true
          cache: true

      - name: Run linters
        run: mise run lint

      - name: Run type checker
        run: mise run typecheck

  test-nvim:
    name: Test (Neovim ${{ matrix.nvim_version }})
    needs: lint
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        nvim_version: ["stable", "nightly"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          experimental: true
          cache: true

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim_version }}

      - name: Download mini.nvim
        run: mise run deps-mini-nvim

      - name: Run tests
        run: mise run test
