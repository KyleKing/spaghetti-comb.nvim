[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "typecheck", "test"]

[tasks.demo]
description = "Run all demo scenarios against a throwaway data directory"
run = '''
DATA_DIR="$(mktemp -d)"
trap 'rm -rf "$DATA_DIR"' EXIT
XDG_DATA_HOME="$DATA_DIR" nvim --headless --noplugin -u ./scripts/minimal_init.lua \
    -c "lua local ok, err = pcall(function() require('demos.run_all').execute() end) if not ok then io.stderr:write(tostring(err) .. '\n') vim.cmd('cquit 1') end" -c "qa!"
'''

[tasks."deps-mini-nvim"]
description = "Download 'mini.nvim' to use its 'mini.test' testing module"
run = '''
DIRECTORY="deps/mini.nvim"
if [ ! -d "$DIRECTORY/lua" ]; then
    git clone --filter=blob:none https://github.com/echasnovski/mini.nvim "$DIRECTORY"
fi
'''
sources = ["deps/mini.nvim"]

[tasks.docs]
description = "Generate vim help tags for doc/spaghetti-comb.txt"
run = [
  "nvim --headless -c 'helptags doc/' -c 'qa!'"
]

[tasks.format]
description = "Format code using stylua (fix mode)"
run = "stylua demos/ plugin/ lua/ scripts/"

[tasks.itest]
depends = ["deps-mini-nvim"]
description = "Integration tests on a pinned flask clone (cli contract + tmux PTY)"
run = "bash tests/itest/run.sh"

[tasks.itest-cli]
description = "Integration tests: sc CLI contract only (no tmux)"
run = "SC_SKIP_PTY=1 bash tests/itest/run.sh"

[tasks.lint]
description = "Check formatting with stylua and lint with selene"
run = ["stylua demos/ plugin/ lua/ scripts/ --check", "selene demos/ plugin/ lua/ scripts/"]

# Note on the -c bodies below: headless Neovim does not exit after a failed -c
# command, so every Lua entry point is wrapped in pcall with an explicit
# `cquit 1`. Without the guard, an error hangs the process until the CI timeout.
[tasks.test]
depends = ["deps-mini-nvim"]
description = "Run all test files"
run = "nvim --headless --noplugin -u ./scripts/minimal_init.lua -c \"lua local ok, err = pcall(function() require('spaghetti-comb.tests.init').run_all() end) if not ok then io.stderr:write(tostring(err) .. '\\n') vim.cmd('cquit 1') end\""

[tasks.test-file]
depends = ["deps-mini-nvim"]
description = "Run test from specified file"
run = "nvim --headless --noplugin -u ./scripts/minimal_init.lua -c \"lua local ok, err = pcall(MiniTest.run_file, vim.fn.fnamemodify('${usage_file?}', ':p')) if not ok then io.stderr:write(tostring(err) .. '\\n') vim.cmd('cquit 1') end\""
usage = 'flag "-f --file <file>" help="Spec file to run" required=#true'

[tasks.typecheck]
depends = ["deps-mini-nvim"]
description = "Type check with emmylua_check"
run = "emmylua_check --warnings-as-errors ."

[tools]
hk = "1.53.0"
pkl = "latest"
stylua = "2.5.2"
"cargo:selene" = "0.31.0"
"pipx:commitizen" = "latest"
"pipx:toml-sort" = "latest"
"ubi:EmmyLuaLs/emmylua-analyzer-rust[exe=emmylua_check]" = "0.24.0"
